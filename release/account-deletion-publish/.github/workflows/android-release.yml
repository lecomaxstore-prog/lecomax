name: Android signed release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
      EXPO_PUBLIC_API_URL: https://lecomax.com

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate source
        run: |
          npm test
          npx tsc --noEmit
          npm run build
          npm --prefix mobile run lint
          npm --prefix mobile run typecheck
          npm run audit:mobile-interactions

      - name: Validate release version
        working-directory: mobile
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Prepare temporary signing credentials
        working-directory: mobile
        run: npm run android:credentials

      - name: Build signed universal APK
        working-directory: mobile
        run: npx eas-cli@21.2.0 build --platform android --profile production-apk-ci --local --non-interactive --output ../release-raw.apk

      - name: Build signed Android App Bundle
        working-directory: mobile
        run: npx eas-cli@21.2.0 build --platform android --profile production-aab-ci --local --non-interactive --output ../release-raw.aab

      - name: Package and checksum artifacts
        working-directory: mobile
        run: |
          npm run android:verify-signature -- ../release-raw.apk
          npm run android:artifact -- ../release-raw.apk
          npm run android:artifact -- ../release-raw.aab

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lecomax-android-${{ github.ref_name }}
          path: release/android/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/android/* --verify-tag --title "L’ecomax ${GITHUB_REF_NAME}" --generate-notes
