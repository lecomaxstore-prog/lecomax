<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black circle with subtle gradient -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Green border ring -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#4cbe3a" stroke-width="1.5" opacity="0.9"/>

  <!-- White L — bold block letter -->
  <rect x="16" y="22" width="11" height="46" fill="white" rx="1"/>
  <rect x="16" y="57" width="28" height="11" fill="white" rx="1"/>

  <!-- Green M — stylized with deep chevron in middle -->
  <path d="
    M 44 22
    L 44 68
    L 54 68
    L 54 45
    L 62 60
    L 70 45
    L 70 68
    L 80 68
    L 80 22
    L 71 22
    L 62 43
    L 53 22
    Z
  " fill="#5cb82e"/>
</svg>
